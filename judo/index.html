<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Judo Juniors — bolalar uchun dzyudo</title>
<meta name="description" content="Judo Juniors — bolalar uchun dzyudo mashg'ulotlari. YouTube kanalimizni kuzating!">
<meta name="theme-color" content="#070b1a">
<meta property="og:title" content="Judo Juniors">
<meta property="og:description" content="Bolalar uchun dzyudo mashg'ulotlari. YouTube kanalimizni kuzating!">
<meta property="og:image" content="https://dinmuhammad.uz/judo/og.jpg">
<meta property="og:url" content="https://dinmuhammad.uz/judo/">
<meta property="og:type" content="website">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --red:#e3262f; --red2:#ff4b3e; --blue:#1d4ed8; --navy:#070b1a;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:'Montserrat',system-ui,sans-serif; color:#fff; background:var(--navy);
    min-height:100svh; overflow-x:hidden; -webkit-tap-highlight-color:transparent;
  }

  /* ---------- Background layers ---------- */
  .bg{position:fixed;inset:0;z-index:0;overflow:hidden;
    background:
      radial-gradient(120% 70% at 50% 0%, #13235a 0%, rgba(7,11,26,0) 60%),
      radial-gradient(90% 60% at 50% 110%, #3a0a12 0%, rgba(7,11,26,0) 65%),
      linear-gradient(180deg,#0a1230 0%,#070b1a 55%,#05070f 100%);
  }
  /* energy swirls: red + blue brush strokes rotating like the logo */
  .swirl{position:absolute;left:50%;top:30%;width:150vmax;height:150vmax;transform:translate(-50%,-50%);
    border-radius:50%;filter:blur(28px);opacity:.55;mix-blend-mode:screen}
  .swirl.r{background:conic-gradient(from 0deg, transparent 0 55%, rgba(227,38,47,.9) 62%, transparent 72%, transparent 100%);
    animation:spin 14s linear infinite}
  .swirl.b{background:conic-gradient(from 180deg, transparent 0 58%, rgba(37,99,235,.85) 66%, transparent 76%, transparent 100%);
    animation:spin 19s linear infinite reverse}
  @keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}

  /* giant kanji watermark 柔道 */
  .kanji{position:absolute;right:-6vmin;top:8vh;font-size:44vmin;line-height:.9;font-weight:800;
    writing-mode:vertical-rl;color:rgba(255,255,255,.035);letter-spacing:-2vmin;
    animation:float 9s ease-in-out infinite;user-select:none}
  @keyframes float{50%{transform:translateY(-3vh)}}

  /* tatami floor in perspective */
  .tatami{position:absolute;left:-50%;right:-50%;bottom:-8vh;height:48vh;
    transform:perspective(420px) rotateX(62deg);transform-origin:bottom;
    background:
      linear-gradient(rgba(227,38,47,.0),rgba(227,38,47,.0)),
      repeating-linear-gradient(90deg, rgba(255,255,255,.07) 0 2px, transparent 2px 90px),
      repeating-linear-gradient(0deg, rgba(255,255,255,.07) 0 2px, transparent 2px 180px),
      linear-gradient(180deg, rgba(29,78,216,.0) 0%, rgba(29,78,216,.35) 40%, rgba(227,38,47,.35) 100%);
    -webkit-mask-image:linear-gradient(to top,#000 30%,transparent 100%);
            mask-image:linear-gradient(to top,#000 30%,transparent 100%);
    animation:floor 6s linear infinite}
  @keyframes floor{to{background-position:0 0,0 0,0 180px,0 0}}

  canvas#fx{position:absolute;inset:0;width:100%;height:100%}

  /* ---------- Content ---------- */
  main{position:relative;z-index:2;min-height:100svh;display:flex;flex-direction:column;
    align-items:center;justify-content:center;padding:48px 22px 36px;text-align:center}

  .logo-wrap{position:relative;width:min(58vw,230px);aspect-ratio:1;margin-bottom:26px;
    animation:pop .9s cubic-bezier(.2,1.4,.4,1) both}
  .logo-wrap::before,.logo-wrap::after{content:"";position:absolute;inset:-12px;border-radius:50%}
  .logo-wrap::before{
    background:conic-gradient(var(--red),transparent 30%,var(--blue) 50%,transparent 80%,var(--red));
    animation:spinR 4s linear infinite;
    -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 5px),#000 calc(100% - 4px));
            mask:radial-gradient(farthest-side,transparent calc(100% - 5px),#000 calc(100% - 4px))}
  .logo-wrap::after{inset:-30px;background:radial-gradient(circle,rgba(227,38,47,.45),transparent 65%);
    animation:breathe 2.6s ease-in-out infinite;z-index:-1}
  @keyframes spinR{to{transform:rotate(360deg)}}
  @keyframes breathe{50%{transform:scale(1.12);opacity:.6}}
  .logo{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;
    box-shadow:0 18px 50px rgba(0,0,0,.6), 0 0 0 3px rgba(255,255,255,.9)}
  @keyframes pop{from{transform:scale(.4) rotate(-25deg);opacity:0}}

  h1{font-family:'Bebas Neue',sans-serif;font-weight:400;font-size:clamp(48px,15vw,78px);
    line-height:.9;letter-spacing:3px;
    background:linear-gradient(100deg,#fff 0%,#fff 40%,#ffd6d6 48%,#fff 56%,#fff 100%);
    background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
    animation:shine 4s ease-in-out infinite, rise .8s .15s both;
    text-shadow:0 0 0 transparent; filter:drop-shadow(0 6px 18px rgba(0,0,0,.5))}
  h1 span{display:block;font-size:.62em;letter-spacing:9px;
    background:linear-gradient(90deg,var(--red2),var(--red));-webkit-background-clip:text;background-clip:text;color:transparent}
  @keyframes shine{0%,30%{background-position:100% 0}70%,100%{background-position:0 0}}
  @keyframes rise{from{transform:translateY(24px);opacity:0}}

  .tag{margin-top:14px;font-size:15px;font-weight:500;color:#c9d4ff;opacity:.9;animation:rise .8s .3s both}

  /* belt progression */
  .belts{display:flex;gap:6px;margin:22px 0 34px;animation:rise .8s .45s both}
  .belts i{width:30px;height:9px;border-radius:5px;display:block;position:relative;overflow:hidden;
    box-shadow:0 2px 6px rgba(0,0,0,.4);transform-origin:left;animation:grow .5s both}
  .belts i:nth-child(1){background:#f4f4f4;animation-delay:.6s}
  .belts i:nth-child(2){background:#ffd60a;animation-delay:.7s}
  .belts i:nth-child(3){background:#ff8c1a;animation-delay:.8s}
  .belts i:nth-child(4){background:#22c55e;animation-delay:.9s}
  .belts i:nth-child(5){background:#2563eb;animation-delay:1s}
  .belts i:nth-child(6){background:#8b4a1f;animation-delay:1.1s}
  .belts i:nth-child(7){background:#111;outline:1px solid #444;animation-delay:1.2s}
  @keyframes grow{from{transform:scaleX(0)}}

  /* ---------- The one button ---------- */
  .yt{position:relative;display:flex;align-items:center;gap:14px;width:min(100%,360px);
    padding:16px 22px 16px 16px;border-radius:20px;text-decoration:none;color:#fff;
    background:linear-gradient(135deg,#ff3b3b 0%,#e3262f 45%,#b3141c 100%);
    box-shadow:0 14px 34px rgba(227,38,47,.55), inset 0 1px 0 rgba(255,255,255,.35), inset 0 -3px 0 rgba(0,0,0,.25);
    overflow:hidden;isolation:isolate;
    animation:rise .8s .6s both, pulse 2.2s 1.6s ease-in-out infinite;
    transition:transform .15s ease}
  .yt:active{transform:scale(.96)}
  .yt::before{content:"";position:absolute;inset:-2px;border-radius:22px;z-index:-2;
    background:conic-gradient(from 0deg,#fff0,#fff9,#fff0 25%);animation:spinR 3s linear infinite;opacity:.0}
  .yt::after{content:"";position:absolute;top:0;bottom:0;width:60px;left:-80px;z-index:1;
    background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);
    transform:skewX(-20deg);animation:sweep 3s 1.8s ease-in-out infinite}
  @keyframes sweep{0%{left:-80px}45%,100%{left:120%}}
  @keyframes pulse{50%{box-shadow:0 14px 50px rgba(227,38,47,.9),0 0 0 8px rgba(227,38,47,.12),
    inset 0 1px 0 rgba(255,255,255,.35), inset 0 -3px 0 rgba(0,0,0,.25)}}
  .yt .ic{flex:none;width:52px;height:52px;border-radius:14px;background:#fff;display:grid;place-items:center;
    box-shadow:0 4px 12px rgba(0,0,0,.25)}
  .yt .ic svg{width:30px;height:30px}
  .yt .tx{text-align:left;flex:1;position:relative;z-index:2}
  .yt b{display:block;font-size:18px;font-weight:800;letter-spacing:.3px}
  .yt small{display:block;font-size:12.5px;opacity:.85;margin-top:2px;font-weight:500}
  .yt .arr{position:relative;z-index:2;font-size:22px;animation:nudge 1.4s ease-in-out infinite}
  @keyframes nudge{50%{transform:translateX(5px)}}

  .hint{margin-top:16px;font-size:12px;color:#8e9bd1;animation:rise .8s .8s both}
  footer{margin-top:auto;padding-top:40px;font-size:11px;color:#5b678f;letter-spacing:1px}

  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
  <div class="bg" aria-hidden="true">
    <div class="swirl r"></div>
    <div class="swirl b"></div>
    <div class="kanji">柔道</div>
    <div class="tatami"></div>
    <canvas id="fx"></canvas>
  </div>

  <main>
    <div class="logo-wrap"><img class="logo" src="logo.jpg" alt="Judo Juniors logotipi" width="480" height="480"></div>

    <h1>JUDO<span>JUNIORS</span></h1>
    <p class="tag">Bolalar uchun dzyudo mashg'ulotlari 🥋</p>

    <div class="belts" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>

    <a id="yt" class="yt" href="https://www.youtube.com/@Judo.juniors" target="_blank" rel="noopener">
      <span class="ic" aria-hidden="true">
        <svg viewBox="0 0 24 24"><rect x="1" y="4.5" width="22" height="15" rx="4.5" fill="#e3262f"/><path d="M10 8.8v6.4l5.6-3.2z" fill="#fff"/></svg>
      </span>
      <span class="tx"><b>YouTube kanalimiz</b><small id="sub">Mashg'ulot videolarini ko'ring</small></span>
      <span class="arr" aria-hidden="true">›</span>
    </a>
    <p class="hint" id="hint">Bosing — YouTube ilovasida ochiladi</p>

    <footer>© JUDO JUNIORS</footer>
  </main>

<script>
(function(){
  /* ---------- Smart YouTube button: detects Android / iPhone ---------- */
  var HANDLE = '@Judo.juniors';
  var WEB = 'https://www.youtube.com/' + HANDLE;
  var ua = navigator.userAgent || '';
  var isAndroid = /android/i.test(ua);
  var isIOS = /iphone|ipad|ipod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var btn = document.getElementById('yt');

  if (!isAndroid && !isIOS) document.getElementById('hint').textContent = 'Bosing — YouTube kanali ochiladi';

  btn.addEventListener('click', function(e){
    if (isAndroid) {
      e.preventDefault();
      location.href = 'intent://www.youtube.com/' + HANDLE +
        '#Intent;scheme=https;package=com.google.android.youtube;S.browser_fallback_url=' +
        encodeURIComponent(WEB) + ';end';
    } else if (isIOS) {
      e.preventDefault();
      var start = Date.now();
      location.href = 'youtube://www.youtube.com/' + HANDLE;
      setTimeout(function(){
        // App didn't open (page still visible) -> open the website
        if (!document.hidden && Date.now() - start < 3000) location.href = WEB;
      }, 1600);
    }
    // desktop: normal link opens youtube.com in a new tab
  });

  /* ---------- Particles: rising sparks + falling rain streaks ---------- */
  var c = document.getElementById('fx'), x = c.getContext('2d'), W, H, dpr, sparks = [], drops = [];
  function size(){
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = c.width = innerWidth * dpr; H = c.height = innerHeight * dpr;
  }
  size(); addEventListener('resize', size);
  function rnd(a,b){return a + Math.random()*(b-a)}
  for (var i=0;i<45;i++) sparks.push({x:rnd(0,1),y:rnd(0,1),r:rnd(.6,2.2),v:rnd(.0006,.002),h:Math.random()<.6?0:220,a:rnd(.3,.9),w:rnd(0,6.28)});
  for (var j=0;j<70;j++) drops.push({x:rnd(0,1),y:rnd(0,1),l:rnd(10,26),v:rnd(.006,.012),a:rnd(.08,.22)});
  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  function tick(t){
    x.clearRect(0,0,W,H);
    // rain
    x.lineCap='round';
    for (var k=0;k<drops.length;k++){var d=drops[k];
      d.y += d.v; d.x += d.v*.18; if (d.y>1.05){d.y=-.05; d.x=rnd(-.1,1)}
      x.strokeStyle='rgba(190,210,255,'+d.a+')'; x.lineWidth=1*dpr;
      x.beginPath(); x.moveTo(d.x*W,d.y*H); x.lineTo(d.x*W - d.l*.18*dpr, d.y*H - d.l*dpr); x.stroke();
    }
    // sparks
    for (var m=0;m<sparks.length;m++){var s=sparks[m];
      s.y -= s.v; s.w += .02; if (s.y<-.05){s.y=1.05; s.x=rnd(0,1)}
      var px=(s.x + Math.sin(s.w)*.01)*W, py=s.y*H, r=s.r*dpr;
      var g=x.createRadialGradient(px,py,0,px,py,r*4);
      var col = s.h===0 ? '255,70,60' : '90,140,255';
      g.addColorStop(0,'rgba('+col+','+s.a+')'); g.addColorStop(1,'rgba('+col+',0)');
      x.fillStyle=g; x.beginPath(); x.arc(px,py,r*4,0,6.283); x.fill();
    }
    if (!reduce) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
