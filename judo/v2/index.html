<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Judo Juniors</title>
<meta name="description" content="Judo Juniors — bolalar uchun dzyudo mashg‘ulotlari. YouTube kanalimizni kuzating!">
<meta name="theme-color" content="#f3eadb">
<meta property="og:title" content="Judo Juniors">
<meta property="og:description" content="Bolalar uchun dzyudo · Дзюдо для детей · Judo for kids">
<meta property="og:image" content="https://dinmuhammad.uz/judo/og.jpg">
<meta property="og:url" content="https://dinmuhammad.uz/judo/v2/">
<meta property="og:type" content="website">
<link rel="icon" href="../icon.png">
<link rel="apple-touch-icon" href="../icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@500;600;700;800&family=Yuji+Syuku&family=Noto+Serif:ital,wght@1,500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f3eadb; --paper2:#eadfcb; --ink:#14110f; --red:#d7262e; --red-d:#a4161d; --navy:#13214f;
    --ease:cubic-bezier(.2,.9,.2,1);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%}
  body{font-family:'Montserrat',system-ui,sans-serif;color:var(--ink);background:var(--paper);
    overflow-x:hidden;-webkit-tap-highlight-color:transparent}

  /* ================= BACKGROUND ================= */
  .bg{position:fixed;inset:0;z-index:0;overflow:hidden;
    background:
      radial-gradient(120% 80% at 50% 35%, #fbf5ea 0%, var(--paper) 45%, var(--paper2) 100%)}
  /* washi paper fibres */
  .bg::before{content:"";position:absolute;inset:0;opacity:.55;mix-blend-mode:multiply;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .45  0 0 0 0 .38  0 0 0 0 .3  0 0 0 .18 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
  /* seigaiha waves at the bottom */
  .waves{position:absolute;left:0;right:0;bottom:0;height:26vh;opacity:.16;
    background:
      radial-gradient(circle at 50% 100%, transparent 18px, var(--red) 19px 21px, transparent 22px 28px, var(--red) 29px 31px, transparent 32px 38px, var(--red) 39px 41px, transparent 42px) 0 0/80px 40px,
      radial-gradient(circle at 50% 100%, transparent 18px, var(--red) 19px 21px, transparent 22px 28px, var(--red) 29px 31px, transparent 32px 38px, var(--red) 39px 41px, transparent 42px) 40px 20px/80px 40px;
    -webkit-mask-image:linear-gradient(to top,#000,transparent);mask-image:linear-gradient(to top,#000,transparent);
    animation:tide 12s linear infinite}
  @keyframes tide{to{background-position:80px 0,120px 20px}}

  /* big vertical calligraphy */
  .kanji{position:absolute;left:-1vmin;top:6vh;writing-mode:vertical-rl;font-family:'Yuji Syuku',serif;
    font-size:clamp(120px,34vmin,300px);line-height:1;color:var(--ink);opacity:0;
    animation:inkIn 2.2s .3s var(--ease) forwards}
  .kanji.r{left:auto;right:-2vmin;top:auto;bottom:16vh;font-size:clamp(60px,15vmin,130px);color:var(--red);
    animation-delay:.9s}
  @keyframes inkIn{0%{opacity:0;filter:blur(14px);transform:scale(1.15)}100%{opacity:.07;filter:blur(0);transform:none}}
  .kanji.r{--o:.12}
  .kanji.r{animation-name:inkInR}
  @keyframes inkInR{0%{opacity:0;filter:blur(14px)}100%{opacity:.14;filter:blur(0)}}

  canvas#petals{position:absolute;inset:0;width:100%;height:100%;z-index:3;pointer-events:none}

  /* ================= LANG SWITCH ================= */
  .lang{position:fixed;top:max(14px,env(safe-area-inset-top));right:14px;z-index:20;display:flex;gap:4px;
    padding:4px;border-radius:999px;background:rgba(20,17,15,.88);backdrop-filter:blur(8px);
    box-shadow:0 8px 24px rgba(0,0,0,.18);animation:drop .8s 1.6s var(--ease) both}
  .lang button{border:0;background:transparent;color:#d9cfc0;font:700 12px/1 'Montserrat',system-ui,sans-serif;letter-spacing:1px;
    padding:8px 11px;border-radius:999px;cursor:pointer;transition:.3s var(--ease)}
  .lang button.on{background:var(--red);color:#fff;box-shadow:0 4px 12px rgba(215,38,46,.5)}
  @keyframes drop{from{transform:translateY(-30px);opacity:0}}

  /* ================= HERO ================= */
  main{position:relative;z-index:5;min-height:100svh;display:flex;flex-direction:column;align-items:center;
    padding:70px 22px 26px;text-align:center}

  .stage{position:relative;width:min(60vw,250px);margin-top:6px;aspect-ratio:1;display:grid;place-items:center;
    transform-style:preserve-3d;transition:transform .25s ease-out}
  /* rising red sun */
  .sun{position:absolute;width:112%;aspect-ratio:1;border-radius:50%;
    background:radial-gradient(circle at 40% 35%, #ff5a4f, var(--red) 55%, var(--red-d));
    box-shadow:0 0 80px rgba(215,38,46,.45);animation:rise 1.6s var(--ease) both, glow 4s 1.6s ease-in-out infinite}
  @keyframes rise{from{transform:translateY(60%) scale(.6);opacity:0}}
  @keyframes glow{50%{box-shadow:0 0 130px rgba(215,38,46,.7)}}
  /* sun rays */
  .rays{position:absolute;width:190%;aspect-ratio:1;border-radius:50%;opacity:.13;
    background:repeating-conic-gradient(var(--red) 0 6deg, transparent 6deg 18deg);
    -webkit-mask:radial-gradient(circle,#000 20%,transparent 70%);mask:radial-gradient(circle,#000 20%,transparent 70%);
    animation:spin 60s linear infinite, fade 2s .8s both}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes fade{from{opacity:0}}

  /* ENSO — ink brush circle drawn live */
  .enso{position:absolute;width:118%;height:118%;overflow:visible;transform:rotate(-60deg)}
  .enso path{fill:none;stroke:var(--ink);stroke-linecap:round;filter:url(#brush);
    stroke-dasharray:1000;stroke-dashoffset:1000;animation:draw 1.6s .9s cubic-bezier(.6,.05,.3,1) forwards}
  .enso path.thin{stroke-width:3;opacity:.55;animation-delay:1.05s}
  @keyframes draw{to{stroke-dashoffset:0}}

  .logo{position:relative;width:72%;height:auto;aspect-ratio:1;border-radius:50%;object-fit:cover;
    border:5px solid #fff;box-shadow:0 22px 50px rgba(20,17,15,.45),0 0 0 1px rgba(0,0,0,.1);
    animation:logoIn 1.1s .5s cubic-bezier(.2,1.5,.4,1) both, bob 5s 2s ease-in-out infinite;transform:translateZ(40px)}
  @keyframes logoIn{from{transform:scale(0) rotate(-90deg)}}
  @keyframes bob{50%{translate:0 -8px}}

  /* hanko seal stamp */
  .hanko{position:absolute;right:-2%;bottom:6%;width:62px;height:62px;border-radius:12px;background:var(--red);
    color:#fff;font-family:'Yuji Syuku',serif;font-size:21px;line-height:1.05;display:grid;place-items:center;
    writing-mode:vertical-rl;box-shadow:0 6px 14px rgba(164,22,29,.45);transform:rotate(-12deg);
    border:2px solid #fff;animation:stamp .45s 2.4s cubic-bezier(.3,1.8,.5,1) both}
  @keyframes stamp{0%{transform:rotate(-12deg) scale(3);opacity:0}100%{opacity:1}}

  /* ================= TITLE ================= */
  h1{margin-top:26px;font-family:'Bebas Neue',sans-serif;font-weight:400;line-height:.85;
    font-size:clamp(58px,17vw,96px);letter-spacing:2px;color:var(--ink)}
  h1 .w{display:inline-block;overflow:hidden;vertical-align:top}
  h1 .w>span{display:inline-block;animation:up .9s var(--ease) both}
  h1 .l2{display:block;font-size:.5em;letter-spacing:.42em;margin-right:-.42em;color:var(--red)}
  h1 .l2 span{animation-delay:.15s}
  @keyframes up{from{transform:translateY(105%)}}
  h1 .b span{animation-delay:1.3s}
  h1 .l2 .w span{animation-delay:1.45s}

  .brush{width:min(70vw,280px);height:14px;margin:12px auto 0;display:block;overflow:visible}
  .brush path{fill:none;stroke:var(--red);stroke-width:7;stroke-linecap:round;filter:url(#brush);
    stroke-dasharray:400;stroke-dashoffset:400;animation:draw 1s 1.8s ease-out forwards}

  .tag{margin-top:14px;font-weight:600;font-size:16px;color:#3c342d;min-height:1.3em}

  /* values chips */
  .vals{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:16px 0 22px}
  .vals li{list-style:none;display:flex;align-items:center;gap:7px;padding:7px 11px 7px 7px;border-radius:999px;white-space:nowrap;
    background:rgba(255,255,255,.65);border:1px solid rgba(20,17,15,.1);font-size:12.5px;font-weight:700;
    box-shadow:0 4px 12px rgba(20,17,15,.06);animation:chip .6s var(--ease) both}
  .vals li:nth-child(1){animation-delay:2s}.vals li:nth-child(2){animation-delay:2.1s}.vals li:nth-child(3){animation-delay:2.2s}
  .vals i{font-style:normal;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;
    font-family:'Yuji Syuku',serif;font-size:13px;color:#fff;background:var(--ink)}
  .vals li:nth-child(2) i{background:var(--red)}
  .vals li:nth-child(3) i{background:var(--navy)}
  @keyframes chip{from{transform:translateY(16px) scale(.9);opacity:0}}

  /* ================= THE BUTTON ================= */
  .cta{position:relative;width:min(100%,370px);animation:chip .8s 2.35s var(--ease) both}
  .yt{position:relative;display:flex;align-items:center;gap:14px;padding:14px 18px 14px 14px;border-radius:22px;
    background:var(--ink);color:#fff;text-decoration:none;overflow:hidden;isolation:isolate;
    box-shadow:0 18px 40px rgba(20,17,15,.35), 0 0 0 0 rgba(215,38,46,.5);
    transition:transform .2s var(--ease);animation:ring 2.4s 3s infinite}
  .yt:active{transform:scale(.96)}
  @keyframes ring{0%{box-shadow:0 18px 40px rgba(20,17,15,.35),0 0 0 0 rgba(215,38,46,.55)}
    70%{box-shadow:0 18px 40px rgba(20,17,15,.35),0 0 0 16px rgba(215,38,46,0)}100%{box-shadow:0 18px 40px rgba(20,17,15,.35),0 0 0 0 rgba(215,38,46,0)}}
  /* red brush swipe inside the button */
  .yt::before{content:"";position:absolute;inset:0;z-index:-1;
    background:linear-gradient(100deg,var(--red) 0%,var(--red-d) 100%);
    clip-path:polygon(0 0,32% 0,22% 100%,0 100%);transition:clip-path .6s var(--ease)}
  .yt:hover::before{clip-path:polygon(0 0,100% 0,100% 100%,0 100%)}
  .yt::after{content:"";position:absolute;top:-50%;bottom:-50%;width:50px;left:-70px;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);transform:rotate(20deg);
    animation:sweep 3.2s 3s ease-in-out infinite}
  @keyframes sweep{0%{left:-70px}40%,100%{left:115%}}
  .yt .ic{flex:none;width:56px;height:56px;border-radius:16px;background:#fff;display:grid;place-items:center;
    box-shadow:0 6px 14px rgba(0,0,0,.3)}
  .yt .ic svg{width:32px;height:32px;animation:beat 1.6s 3s ease-in-out infinite}
  @keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.18)}30%{transform:scale(1)}45%{transform:scale(1.1)}}
  .yt .tx{flex:1;text-align:left;min-width:0}
  .yt b{display:block;font-size:18px;font-weight:800}
  .yt small{display:block;font-size:12.5px;color:#d9cfc0;margin-top:3px;font-weight:500}
  .yt .go{flex:none;width:34px;height:34px;border-radius:50%;border:1.5px solid rgba(255,255,255,.35);
    display:grid;place-items:center;font-size:18px;animation:nudge 1.4s ease-in-out infinite}
  @keyframes nudge{50%{transform:translateX(4px)}}

  .hint{margin-top:12px;font-size:12px;color:#7a6e62;font-weight:500}

  .motto{margin-top:24px;display:flex;flex-direction:column;align-items:center;gap:4px;opacity:0;animation:fade2 1s 2.8s forwards}
  .motto .jp{font-family:'Yuji Syuku',serif;font-size:22px;color:var(--red);letter-spacing:4px}
  .motto q{font-family:'Noto Serif',serif;font-style:italic;font-size:14.5px;color:#4a4038;quotes:"«" "»"}
  @keyframes fade2{to{opacity:1}}

  footer{margin-top:auto;padding-top:34px;font-size:11px;letter-spacing:2px;color:#9a8d7e}

  .i18n{transition:opacity .25s ease, transform .25s ease}
  .swap .i18n{opacity:0;transform:translateY(6px)}

  @media (min-height:860px){main{justify-content:center}}
  @media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-delay:0s!important;animation-iteration-count:1!important}}
</style>
</head>
<body>
  <!-- rough brush filter used by enso + underline -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <filter id="brush" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="5"/>
    </filter>
  </svg>

  <div class="bg" aria-hidden="true">
    <div class="kanji">柔道</div>
    <div class="kanji r">礼</div>
    <div class="waves"></div>
    <canvas id="petals"></canvas>
  </div>

  <nav class="lang" aria-label="Til / Язык / Language">
    <button data-l="uz">UZ</button><button data-l="ru">RU</button><button data-l="en">EN</button>
  </nav>

  <main>
    <div class="stage" id="stage">
      <div class="rays"></div>
      <div class="sun"></div>
      <svg class="enso" viewBox="0 0 200 200" aria-hidden="true">
        <path d="M100 12 C150 10 190 48 188 100 C186 152 148 190 98 188 C50 186 12 150 13 100 C14 62 38 30 72 18" stroke-width="9"/>
        <path class="thin" d="M104 6 C158 8 194 50 193 98 C192 140 168 172 134 186"/>
      </svg>
      <img class="logo" src="../logo.jpg" alt="Judo Juniors" width="480" height="480">
      <div class="hanko" aria-hidden="true">柔道</div>
    </div>

    <h1><span class="w b"><span>JUDO</span></span><span class="l2"><span class="w"><span>JUNIORS</span></span></span></h1>
    <svg class="brush" viewBox="0 0 280 14" preserveAspectRatio="none" aria-hidden="true"><path d="M4 9 C70 3 150 4 276 7"/></svg>

    <p class="tag i18n" data-k="tag"></p>

    <ul class="vals">
      <li><i>礼</i><span class="i18n" data-k="v1"></span></li>
      <li><i>力</i><span class="i18n" data-k="v2"></span></li>
      <li><i>友</i><span class="i18n" data-k="v3"></span></li>
    </ul>

    <div class="cta">
      <a id="yt" class="yt" href="https://www.youtube.com/@Judo.juniors" target="_blank" rel="noopener">
        <span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="1" y="4.5" width="22" height="15" rx="4.5" fill="#d7262e"/><path d="M10 8.8v6.4l5.6-3.2z" fill="#fff"/></svg></span>
        <span class="tx"><b class="i18n" data-k="btn"></b><small class="i18n" data-k="sub"></small></span>
        <span class="go" aria-hidden="true">→</span>
      </a>
      <p class="hint i18n" id="hint" data-k="hint"></p>
    </div>

    <div class="motto">
      <span class="jp">七転び八起き</span>
      <q class="i18n" data-k="motto"></q>
    </div>

    <footer>© JUDO JUNIORS</footer>
  </main>

<script>
(function(){
  /* ================= I18N ================= */
  var T = {
    uz:{tag:"Bolalar uchun dzyudo mashg‘ulotlari", v1:"Intizom", v2:"Kuch", v3:"Do‘stlik",
        btn:"YouTube kanalimiz", sub:"Mashg‘ulot videolarini ko‘ring",
        hintApp:"Bosing — YouTube ilovasida ochiladi", hintWeb:"Bosing — YouTube kanali ochiladi",
        motto:"Yetti marta yiqil, sakkiz marta tur", title:"Judo Juniors — bolalar uchun dzyudo"},
    ru:{tag:"Занятия дзюдо для детей", v1:"Дисциплина", v2:"Сила", v3:"Дружба",
        btn:"Наш YouTube-канал", sub:"Смотрите видео тренировок",
        hintApp:"Нажмите — откроется в приложении YouTube", hintWeb:"Нажмите — откроется YouTube-канал",
        motto:"Упади семь раз — встань восемь", title:"Judo Juniors — дзюдо для детей"},
    en:{tag:"Judo classes for kids", v1:"Discipline", v2:"Strength", v3:"Friendship",
        btn:"Our YouTube channel", sub:"Watch our training videos",
        hintApp:"Tap — opens in the YouTube app", hintWeb:"Tap — opens the YouTube channel",
        motto:"Fall seven times, stand up eight", title:"Judo Juniors — judo for kids"}
  };
  var ua = navigator.userAgent || '';
  var isAndroid = /android/i.test(ua);
  var isIOS = /iphone|ipad|ipod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var mobile = isAndroid || isIOS;

  function pick(){
    var q = (location.search.match(/[?&]lang=(uz|ru|en)/) || [])[1];
    if (q) return q;
    try { var s = localStorage.getItem('jj-lang'); if (T[s]) return s; } catch(e){}
    var n = (navigator.language || 'uz').slice(0,2).toLowerCase();
    return n === 'ru' ? 'ru' : n === 'en' ? 'en' : 'uz';
  }
  function apply(l, animate){
    var d = T[l];
    function fill(){
      document.querySelectorAll('[data-k]').forEach(function(el){
        var k = el.getAttribute('data-k');
        el.textContent = k === 'hint' ? (mobile ? d.hintApp : d.hintWeb) : d[k];
      });
      document.documentElement.lang = l; document.title = d.title;
      document.querySelectorAll('.lang button').forEach(function(b){ b.classList.toggle('on', b.dataset.l === l) });
      document.body.classList.remove('swap');
    }
    if (animate){ document.body.classList.add('swap'); setTimeout(fill, 220) } else fill();
    try { localStorage.setItem('jj-lang', l) } catch(e){}
  }
  document.querySelectorAll('.lang button').forEach(function(b){
    b.addEventListener('click', function(){ apply(b.dataset.l, true); burst(b.getBoundingClientRect(), 10) });
  });
  apply(pick(), false);

  /* ================= SMART YOUTUBE BUTTON ================= */
  var HANDLE = '@Judo.juniors', WEB = 'https://www.youtube.com/' + HANDLE;
  document.getElementById('yt').addEventListener('click', function(e){
    burst(this.getBoundingClientRect(), 26);
    if (isAndroid){
      e.preventDefault();
      var intent = 'intent://www.youtube.com/' + HANDLE + '#Intent;scheme=https;package=com.google.android.youtube;S.browser_fallback_url=' + encodeURIComponent(WEB) + ';end';
      setTimeout(function(){ location.href = intent }, 220);
    } else if (isIOS){
      e.preventDefault();
      var t = Date.now();
      setTimeout(function(){
        location.href = 'youtube://www.youtube.com/' + HANDLE;
        setTimeout(function(){ if (!document.hidden && Date.now() - t < 3500) location.href = WEB }, 1600);
      }, 220);
    }
  });

  /* ================= PARALLAX TILT ================= */
  var stage = document.getElementById('stage');
  addEventListener('pointermove', function(e){
    var x = e.clientX / innerWidth - .5, y = e.clientY / innerHeight - .5;
    stage.style.transform = 'perspective(800px) rotateY(' + (x*14) + 'deg) rotateX(' + (-y*14) + 'deg)';
  });

  /* ================= SAKURA PETALS ================= */
  var c = document.getElementById('petals'), g = c.getContext('2d'), W, H, dpr, P = [];
  function size(){ dpr = Math.min(devicePixelRatio || 1, 2); W = c.width = innerWidth*dpr; H = c.height = innerHeight*dpr }
  size(); addEventListener('resize', size);
  function R(a,b){ return a + Math.random()*(b-a) }
  function petal(x,y,burstMode){
    var a = R(0,6.283), sp = R(2,7);
    return {x:x, y:y, s:R(5,11), r:R(0,6.28), vr:R(-.04,.04), f:R(0,6.28),
      vx: burstMode ? Math.cos(a)*sp : R(-.3,.4), vy: burstMode ? Math.sin(a)*sp - 2 : R(.5,1.3),
      hue: Math.random() < .8 ? R(340,358) : 0, life: burstMode ? 1 : -1, red: !burstMode && Math.random()<.15};
  }
  var COUNT = Math.round(Math.min(46, innerWidth/9));
  for (var i=0;i<COUNT;i++) P.push(petal(R(0,innerWidth), R(-innerHeight,innerHeight), false));
  function burst(rect, n){
    var cx = rect.left + rect.width/2, cy = rect.top + rect.height/2;
    for (var i=0;i<n;i++) P.push(petal(cx + R(-rect.width/3, rect.width/3), cy, true));
  }
  window.burst = burst;
  function draw(p){
    g.save(); g.translate(p.x*dpr, p.y*dpr); g.rotate(p.r);
    var s = p.s*dpr, flip = Math.cos(p.f);
    g.scale(1, .55 + .45*Math.abs(flip));
    var grd = g.createLinearGradient(0,-s,0,s);
    if (p.red){ grd.addColorStop(0,'rgba(240,80,80,.95)'); grd.addColorStop(1,'rgba(180,20,30,.9)') }
    else { grd.addColorStop(0,'hsla('+p.hue+',90%,93%,.95)'); grd.addColorStop(1,'hsla('+p.hue+',75%,78%,.95)') }
    g.fillStyle = grd;
    g.beginPath(); g.moveTo(0,-s);
    g.bezierCurveTo(s*.9,-s*.7, s*.8,s*.6, 0,s);
    g.bezierCurveTo(-s*.8,s*.6, -s*.9,-s*.7, 0,-s);
    g.fill();
    g.fillStyle='rgba(255,255,255,.9)'; g.beginPath(); g.moveTo(0,-s); g.lineTo(-s*.12,-s*.55); g.lineTo(s*.12,-s*.55); g.fill();
    g.restore();
  }
  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches, wind = 0;
  function tick(t){
    g.clearRect(0,0,W,H);
    wind = Math.sin(t/3000)*.6;
    for (var i=P.length-1;i>=0;i--){
      var p = P[i];
      p.f += .05; p.r += p.vr;
      if (p.life > 0){ p.vy += .12; p.vx *= .985; p.life -= .012; if (p.life <= 0){ P.splice(i,1); continue } }
      p.x += p.vx + wind*.5 + Math.sin(p.f)*.6; p.y += p.vy;
      if (p.life < 0 && (p.y > innerHeight + 20 || p.x > innerWidth + 30 || p.x < -30)){ p.y = -20; p.x = R(-20, innerWidth) }
      g.globalAlpha = p.life > 0 ? Math.min(1, p.life*1.5) : 1;
      draw(p);
    }
    g.globalAlpha = 1;
    if (!reduce) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();
</script>
